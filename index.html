<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaylyn Lewers</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
    <script
      src="https://kit.fontawesome.com/5a95f7f5fa.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <div class="row nav__row">
            <div class="nav__links">
              <ul>
                <li>
                  <a href="#home" class="nav__link nav__link--active">Home</a>
                </li>
                <li><a href="#about" class="nav__link">About</a></li>
                <li><a href="#projects" class="nav__link">Projects</a></li>
                <li>
                  <a href="#contact" class="nav__link nav__link--primary"
                    >Contact</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
      <section
        class="hero"
        role="button"
        tabindex="0"
        aria-label="Open contact form"
      >
        <div class="terminal__window">
          <div class="terminal__header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal__title">system_intro.exe</span>
          </div>

          <div class="terminal__body">
            <div class="terminal__container">
              <span id="terminal-text"></span><span class="cursor">_</span>
            </div>
          </div>
        </div>

        <div class="visual__frame">
          <div class="avatar__placeholder">
            <span>[ KLYN_OS_v1.0 ]</span>
          </div>
        </div>
      </section>

      <section id="projects" class="projects">
        <h2 class="projects__heading">> FETCHING_PROJECTS...</h2>
        <div id="projects-grid" class="projects__grid"></div>
      </section>
    </section>

    <!-- MODAL -->

    <div id="info-modal" class="modal">
      <div class="modal__window">
        <div class="modal__header">
          <span id="modal-title" class="modal__title">> SYSTEM_DATA</span>
          <button id="modal-close" class="modal__close-btn">X</button>
        </div>
        <div class="modal__body">
          <p id="modal-content" class="modal__text"></p>

          <!-- Form Element (Linked securely to a free form handler) -->
          <form
            id="modal-form"
            action="https://api.web3forms.com/submit"
            method="POST"
            class="modal__form modal__form--hidden"
          >
            <input
              type="hidden"
              name="access_key"
              value="11aef98e-e6c1-43db-b736-ff36b87d3c57"
            />
            <div class="modal__field">
              <label class="modal__label">> USER_EMAIL:</label>
              <input
                type="email"
                name="email"
                required
                class="modal__input"
                placeholder="name@domain.com"
              />
            </div>

            <div class="modal__field">
              <label class="modal__label">> DATA_PAYLOAD:</label>
              <textarea
                name="message"
                required
                class="modal__input modal__input--textarea"
                placeholder="Type your message node here..."
              ></textarea>
            </div>

            <button type="submit" class="modal__submit-btn">
              [ TRANSMIT_COMMUNICATION ]
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>

  <!-- FOOTER -->

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__system">
        <span class="footer__node">> NODE: ACTIVE</span>
        <span id="system-clock" class="footer__clock"
          >> SYS_TIME: 00:00:00 UTC</span
        >
      </div>

      <div class="footer__links">
        <a href="https://github.com/KLewers327" target="_blank" class="footer__link"
          >[ GITHUB ]</a
        >
        <a href="https://www.linkedin.com/in/kaylyn-l-2261a995/" target="_blank" class="footer__link"
          >[ LINKEDIN ]</a
        >
      </div>
    </div>
    <p class="footer__copyright">&copy; 2026 Kaylyn Lewers. ALL RIGHTS RESERVED.</p>
  </footer>
</html>
