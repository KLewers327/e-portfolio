<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaylyn Lewers</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
    <script
      src="https://kit.fontawesome.com/5a95f7f5fa.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <div class="row nav__row">
            <div class="nav__links">
              <ul>
                <li>
                  <a href="#home" class="nav__link nav__link--active">Home</a>
                </li>
                <li><a href="#about" class="nav__link">About</a></li>
                <li><a href="#projects" class="nav__link">Projects</a></li>
                <li>
                  <a href="#contact" class="nav__link nav__link--primary"
                    >Contact</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
      <section class="hero">
        <!-- Left Column: The Interactive Terminal -->
        <div class="terminal-window">
          <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal-title">system_intro.exe</span>
          </div>

          <!-- YOUR DIV GOES HERE -->
          <div class="terminal-body">
            <div class="terminal__container">
              <span id="terminal-text"></span><span class="cursor">_</span>
            </div>
          </div>
        </div>

        <!-- Right Column: Visual Accent Frame -->
        <div class="visual-frame">
          <div class="avatar-placeholder">
            <span>[ KLYN_OS_v1.0 ]</span>
          </div>
        </div>
      </section>
      <header></header>
    </section>
  </body>
</html>
